name: Microservices CI Pipeline

on:
  push:
    branches: [ main, develop, master ]
  pull_request:
    branches: [ main, develop, master ]

jobs:
  user-service-ci:
    name: User Service CI
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      postgres-user:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: user-service
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: kvasik225
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Install Redis tools and PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y redis-tools postgresql-client

      - name: Wait for Redis (проверяем с localhost!)
        run: |
          echo "Waiting for Redis on localhost:6379..."
          for i in {1..30}; do
            if redis-cli -h localhost -p 6379 ping | grep -q PONG; then
              echo "✓ Redis is ready at localhost:6379!"
              break
            fi
            echo "Waiting for Redis... ($i/30)"
            sleep 2
          done

      - name: Wait for PostgreSQL
        run: |
          echo "Waiting for PostgreSQL on localhost:5432..."
          for i in {1..30}; do
            if pg_isready -h localhost -p 5432 -U postgres -d user-service; then
              echo "✓ PostgreSQL is ready!"
              break
            fi
            echo "Waiting for PostgreSQL... ($i/30)"
            sleep 2
          done

      - name: Create test configuration file
        run: |
          mkdir -p user-service/src/test/resources
          cat > user-service/src/test/resources/application-test.properties << 'EOF'
          # Test configuration
          spring.liquibase.enabled=false
          spring.jpa.hibernate.ddl-auto=create-drop
          
          # Database
          spring.datasource.url=jdbc:postgresql://localhost:5432/user-service
          spring.datasource.username=postgres
          spring.datasource.password=kvasik225
          spring.datasource.driver-class-name=org.postgresql.Driver
          
          # Redis - ЛОКАЛЬНЫЙ ХОСТ ДЛЯ ТЕСТОВ!
          spring.redis.host=localhost
          spring.redis.port=6379
          
          # Kafka - полностью отключаем
          spring.kafka.bootstrap-servers=
          spring.kafka.enabled=false
          spring.kafka.listener.auto-startup=false
          spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
          spring.kafka.listener.missing-topics-fatal=false
          
          # JWT
          jwt.secret=test-secret-123
          
          # Logging
          logging.level.org.springframework=WARN
          logging.level.com.innowise=DEBUG
          EOF

      - name: Run unit tests (без интеграционных тестов)
        run: |
          cd user-service
          mvn -B clean test \
            -Dtest=!*IntegrationTest \
            -Dspring.profiles.active=test

      - name: Run integration tests с явными параметрами
        run: |
          cd user-service
          mvn -B test \
            -Dtest=*IntegrationTest \
            -Dspring.liquibase.enabled=false \
            -Dspring.jpa.hibernate.ddl-auto=create-drop \
            -Dspring.datasource.url=jdbc:postgresql://localhost:5432/user-service \
            -Dspring.datasource.username=postgres \
            -Dspring.datasource.password=kvasik225 \
            -Dspring.datasource.driver-class-name=org.postgresql.Driver \
            -Dspring.redis.host=localhost \
            -Dspring.redis.port=6379 \
            -Dspring.kafka.bootstrap-servers= \
            -Dspring.kafka.enabled=false \
            -Dspring.kafka.listener.auto-startup=false \
            -Dspring.autoconfigure.exclude=org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration \
            -Dspring.kafka.listener.missing-topics-fatal=false \
            -Djwt.secret=test-secret-123 \
            -Dspring.profiles.active=test

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: user-service-test-results
          path: user-service/target/surefire-reports/
          retention-days: 7

