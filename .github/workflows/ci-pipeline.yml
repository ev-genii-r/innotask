name: Microservices CI Pipeline

on:
  push:
    branches: [ main, develop, master ]
  pull_request:
    branches: [ main, develop, master ]

jobs:
  user-service:
    name: User Service CI
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build
        run: mvn -B compile -f user-service/pom.xml

      - name: Run Tests
        run: |
          mvn -B test -f user-service/pom.xml
        env:
          SPRING_REDIS_HOST: localhost
          SPRING_REDIS_PORT: 6379

      - name: Package
        run: mvn -B package -f user-service/pom.xml -DskipTests

  order-service:
    name: Order Service CI
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build
        run: mvn -B compile -f order-service/pom.xml

      - name: Run Tests
        run: |
          mvn -B test -f order-service/pom.xml
        env:
          SPRING_REDIS_HOST: localhost
          SPRING_REDIS_PORT: 6379

      - name: Package
        run: mvn -B package -f order-service/pom.xml -DskipTests

  payment-service:
    name: Payment Service CI
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build
        run: mvn -B compile -f payment-service/pom.xml

      - name: Run Tests
        run: |
          mvn -B test -f payment-service/pom.xml
        env:
          SPRING_REDIS_HOST: localhost
          SPRING_REDIS_PORT: 6379

      - name: Package
        run: mvn -B package -f payment-service/pom.xml -DskipTests

  docker-build-all:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [user-service, order-service, payment-service]
    if: always()

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Images
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./user-service/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/${{ github.repository }}/user-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Order Service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./order-service/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/${{ github.repository }}/order-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Payment Service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./payment-service/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/${{ github.repository }}/payment-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max