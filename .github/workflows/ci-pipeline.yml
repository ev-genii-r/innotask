  payment-service-ci:
    name: Payment Service CI
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Install Redis tools
        run: |
          sudo apt-get update
          sudo apt-get install -y redis-tools

      - name: Wait for Redis
        run: |
          echo "Waiting for Redis on localhost:6379..."
          for i in {1..30}; do
            if redis-cli -h localhost -p 6379 ping | grep -q PONG; then
              echo "✓ Redis is ready!"
              break
            fi
            echo "Waiting for Redis... ($i/30)"
            sleep 2
          done

      - name: Wait for MongoDB
        run: |
          echo "Waiting for MongoDB on localhost:27017..."
          for i in {1..30}; do
            if mongosh --host localhost --port 27017 --eval "db.adminCommand('ping')" 2>/dev/null | grep -q "ok.*1"; then
              echo "✓ MongoDB is ready!"
              break
            fi
            echo "Waiting for MongoDB... ($i/30)"
            sleep 2
          done

      - name: Create test configuration file
        run: |
          mkdir -p payment-service/src/test/resources
          cat > payment-service/src/test/resources/application-test.properties << 'EOF'
          # Test configuration
          
          # MongoDB
          spring.data.mongodb.uri=mongodb://localhost:27017/payment-db
          spring.data.mongodb.database=payment-db
          
          # Redis
          spring.redis.host=localhost
          spring.redis.port=6379
          
          # Kafka
          spring.kafka.bootstrap-servers=
          spring.kafka.enabled=false
          spring.kafka.listener.auto-startup=false
          spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
          spring.kafka.listener.missing-topics-fatal=false
          
          # JWT
          jwt.secret=test-secret-123
          EOF

      - name: Run tests
        run: |
          cd payment-service
          mvn -B clean test \
            -Dspring.data.mongodb.uri=mongodb://localhost:27017/payment-db \
            -Dspring.data.mongodb.database=payment-db \
            -Dspring.redis.host=localhost \
            -Dspring.redis.port=6379 \
            -Dspring.kafka.bootstrap-servers= \
            -Dspring.kafka.enabled=false \
            -Dspring.kafka.listener.auto-startup=false \
            -Dspring.autoconfigure.exclude=org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration \
            -Dspring.kafka.listener.missing-topics-fatal=false \
            -Djwt.secret=test-secret-123 \
            -Dspring.profiles.active=test

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: payment-service-test-results
          path: payment-service/target/surefire-reports/
          retention-days: 7

  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [user-service-ci, order-service-ci, payment-service-ci]
    if: always()

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker images
        run: |
          # User Service
          docker build -t ghcr.io/${{ github.repository }}/user-service:latest ./user-service
          docker push ghcr.io/${{ github.repository }}/user-service:latest
          
          # Order Service
          docker build -t ghcr.io/${{ github.repository }}/order-service:latest ./order-service
          docker push ghcr.io/${{ github.repository }}/order-service:latest
          
          # Payment Service
          docker build -t ghcr.io/${{ github.repository }}/payment-service:latest ./payment-service
          docker push ghcr.io/${{ github.repository }}/payment-service:latest

  pipeline-summary:
    name: Pipeline Summary
    runs-on: ubuntu-latest
    needs: [user-service-ci, order-service-ci, payment-service-ci]
    if: always()

    steps:
      - name: Display pipeline results
        run: |
          echo "=== Pipeline Execution Summary ==="
          echo "User Service Tests: ${{ needs.user-service-ci.result }}"
          echo "Order Service Tests: ${{ needs.order-service-ci.result }}"
          echo "Payment Service Tests: ${{ needs.payment-service-ci.result }}"
          echo "=================================="
          
          if [[ "${{ needs.user-service-ci.result }}" == "success" && 
                "${{ needs.order-service-ci.result }}" == "success" && 
                "${{ needs.payment-service-ci.result }}" == "success" ]]; then
            echo "✅ All services passed tests!"
          else
            echo "❌ Some services failed tests"
            exit 1
          fi