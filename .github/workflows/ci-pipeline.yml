name: Microservices CI Pipeline

on:
  push:
    branches: [ main, develop, master ]
  pull_request:
    branches: [ main, develop, master ]

jobs:
  user-service-ci:
    name: User Service CI
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      postgres-user:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: user-service
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: kvasik225
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # Добавляем Kafka для тестов
      kafka:
        image: confluentinc/cp-kafka:7.5.0
        ports:
          - 9092:9092
        env:
          KAFKA_BROKER_ID: 1
          KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
        options: >-
          --health-cmd "kafka-topics --bootstrap-server localhost:9092 --list"
          --health-interval 20s
          --health-timeout 10s
          --health-retries 10

      zookeeper:
        image: confluentinc/cp-zookeeper:7.5.0
        ports:
          - 2181:2181
        env:
          ZOOKEEPER_CLIENT_PORT: 2181
          ZOOKEEPER_TICK_TIME: 2000

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y redis-tools postgresql-client netcat

      - name: Wait for services
        run: |
          echo "Waiting for PostgreSQL..."
          for i in {1..30}; do
            if pg_isready -h localhost -p 5432 -U postgres -d user-service; then
              echo "PostgreSQL is ready!"
              break
            fi
            echo "Waiting for PostgreSQL... ($i/30)"
            sleep 2
          done
          
          echo "Waiting for Redis..."
          for i in {1..30}; do
            if redis-cli -h localhost -p 6379 ping | grep -q PONG; then
              echo "Redis is ready!"
              break
            fi
            echo "Waiting for Redis... ($i/30)"
            sleep 2
          done
          
          echo "Waiting for Zookeeper..."
          for i in {1..30}; do
            if nc -z localhost 2181; then
              echo "Zookeeper is ready!"
              break
            fi
            echo "Waiting for Zookeeper... ($i/30)"
            sleep 3
          done
          
          echo "Waiting for Kafka..."
          for i in {1..40}; do
            if nc -z localhost 9092; then
              echo "Kafka is ready!"
              # Даем Kafka время на полную инициализацию
              sleep 10
              break
            fi
            echo "Waiting for Kafka... ($i/40)"
            sleep 3
          done

      - name: Run tests with Kafka disabled
        run: |
          cd user-service
          mvn -B clean test \
            -Dspring.liquibase.enabled=false \
            -Dspring.jpa.hibernate.ddl-auto=create-drop \
            -Dspring.datasource.url=jdbc:postgresql://localhost:5432/user-service \
            -Dspring.datasource.username=postgres \
            -Dspring.datasource.password=kvasik225 \
            -Dspring.datasource.driver-class-name=org.postgresql.Driver \
            -Dspring.redis.host=localhost \
            -Dspring.redis.port=6379 \
            -Dspring.kafka.enabled=false \
            -Dspring.kafka.listener.auto-startup=false \
            -Djwt.secret=test-secret-123 \
            -Dspring.profiles.active=test

      - name: Run tests with Embedded Kafka
        if: failure()
        run: |
          cd user-service
          mvn -B clean test \
            -Dspring.liquibase.enabled=false \
            -Dspring.jpa.hibernate.ddl-auto=create-drop \
            -Dspring.datasource.url=jdbc:postgresql://localhost:5432/user-service \
            -Dspring.datasource.username=postgres \
            -Dspring.datasource.password=kvasik225 \
            -Dspring.datasource.driver-class-name=org.postgresql.Driver \
            -Dspring.redis.host=localhost \
            -Dspring.redis.port=6379 \
            -Dspring.kafka.bootstrap-servers=localhost:9092 \
            -Dspring.kafka.consumer.group-id=test-group \
            -Dspring.kafka.consumer.auto-offset-reset=earliest \
            -Djwt.secret=test-secret-123 \
            -Dtest=*Test

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: user-service-test-results
          path: user-service/target/surefire-reports/
          retention-days: 7

  # Аналогично для order-service-ci и payment-service-ci
  order-service-ci:
    name: Order Service CI
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      postgres-order:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: order-service
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: kvasik225
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y redis-tools postgresql-client

      - name: Wait for services
        run: |
          echo "Waiting for PostgreSQL..."
          for i in {1..30}; do
            if pg_isready -h localhost -p 5433 -U postgres -d order-service; then
              echo "PostgreSQL is ready!"
              break
            fi
            echo "Waiting for PostgreSQL... ($i/30)"
            sleep 2
          done
          
          echo "Waiting for Redis..."
          for i in {1..30}; do
            if redis-cli -h localhost -p 6379 ping | grep -q PONG; then
              echo "Redis is ready!"
              break
            fi
            echo "Waiting for Redis... ($i/30)"
            sleep 2
          done

      - name: Run tests with Kafka disabled
        run: |
          cd order-service
          mvn -B clean test \
            -Dspring.liquibase.enabled=false \
            -Dspring.jpa.hibernate.ddl-auto=create-drop \
            -Dspring.datasource.url=jdbc:postgresql://localhost:5433/order-service \
            -Dspring.datasource.username=postgres \
            -Dspring.datasource.password=kvasik225 \
            -Dspring.datasource.driver-class-name=org.postgresql.Driver \
            -Dspring.redis.host=localhost \
            -Dspring.redis.port=6379 \
            -Dspring.kafka.enabled=false \
            -Dspring.kafka.listener.auto-startup=false \
            -Djwt.secret=test-secret-123 \
            -Dspring.profiles.active=test

  payment-service-ci:
    name: Payment Service CI
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y redis-tools

      - name: Wait for services
        run: |
          echo "Waiting for MongoDB..."
          for i in {1..30}; do
            if mongosh --host localhost --port 27017 --eval "db.adminCommand('ping')" 2>/dev/null | grep -q "ok.*1"; then
              echo "MongoDB is ready!"
              break
            fi
            echo "Waiting for MongoDB... ($i/30)"
            sleep 2
          done
          
          echo "Waiting for Redis..."
          for i in {1..30}; do
            if redis-cli -h localhost -p 6379 ping | grep -q PONG; then
              echo "Redis is ready!"
              break
            fi
            echo "Waiting for Redis... ($i/30)"
            sleep 2
          done

      - name: Run tests with Kafka disabled
        run: |
          cd payment-service
          mvn -B clean test \
            -Dspring.data.mongodb.uri=mongodb://localhost:27017/payment-db \
            -Dspring.data.mongodb.database=payment-db \
            -Dspring.redis.host=localhost \
            -Dspring.redis.port=6379 \
            -Dspring.kafka.enabled=false \
            -Dspring.kafka.listener.auto-startup=false \
            -Djwt.secret=test-secret-123 \
            -Dspring.profiles.active=test

  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [user-service-ci, order-service-ci, payment-service-ci]
    if: always()

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push User Service
        uses: docker/build-push-action@v5
        with:
          context: ./user-service
          file: ./user-service/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ github.repository }}/user-service:latest
            ghcr.io/${{ github.repository }}/user-service:${{ github.sha }}
          build-args: |
            DB_DRIVER=org.postgresql.Driver
            DB_URL=jdbc:postgresql://user-db:5432/user-service
            DB_USERNAME=postgres
            DB_PASSWORD=kvasik225
            REDIS_HOST=redis
            REDIS_PORT=6379
            KAFKA_BOOTSTRAP_SERVERS=kafka:9092
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            LIQUIBASE_ENABLED=true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  pipeline-summary:
    name: Pipeline Summary
    runs-on: ubuntu-latest
    needs: [user-service-ci, order-service-ci, payment-service-ci]
    if: always()

    steps:
      - name: Display pipeline results
        run: |
          echo "=== Pipeline Execution Summary ==="
          echo "User Service Tests: ${{ needs.user-service-ci.result }}"
          echo "Order Service Tests: ${{ needs.order-service-ci.result }}"
          echo "Payment Service Tests: ${{ needs.payment-service-ci.result }}"
          echo "=================================="
          
          if [[ "${{ needs.user-service-ci.result }}" == "success" && 
                "${{ needs.order-service-ci.result }}" == "success" && 
                "${{ needs.payment-service-ci.result }}" == "success" ]]; then
            echo "✅ All services passed tests!"
          else
            echo "❌ Some services failed tests"
            exit 1
          fi