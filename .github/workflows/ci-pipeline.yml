name: Simplified Microservices CI

on:
  push:
    branches: [ main, develop, master ]
  pull_request:
    branches: [ main, develop, master ]

jobs:
  user-service-ci:
    name: User Service CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Create test properties
        run: |
          mkdir -p user-service/src/test/resources
          cat > user-service/src/test/resources/application-test.properties << 'EOF'
          spring.liquibase.enabled=false
          spring.jpa.hibernate.ddl-auto=create-drop
          spring.datasource.url=jdbc:h2:mem:testdb
          spring.datasource.driver-class-name=org.h2.Driver
          spring.datasource.username=sa
          spring.datasource.password=
          spring.redis.host=localhost
          spring.redis.port=6379
          spring.kafka.bootstrap-servers=
          spring.kafka.enabled=false
          spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
          jwt.secret=test-secret-123
          EOF

      - name: Run only unit tests (skip integration)
        run: |
          cd user-service
          mvn -B clean test -Dtest=!*IntegrationTest

  order-service-ci:
    name: Order Service CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Create test properties
        run: |
          mkdir -p order-service/src/test/resources
          cat > order-service/src/test/resources/application-test.properties << 'EOF'
          spring.liquibase.enabled=false
          spring.jpa.hibernate.ddl-auto=create-drop
          spring.datasource.url=jdbc:h2:mem:testdb
          spring.datasource.driver-class-name=org.h2.Driver
          spring.datasource.username=sa
          spring.datasource.password=
          spring.redis.host=localhost
          spring.redis.port=6379
          spring.kafka.bootstrap-servers=
          spring.kafka.enabled=false
          spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
          jwt.secret=test-secret-123
          EOF

      - name: Run only unit tests (skip integration)
        run: |
          cd order-service
          mvn -B clean test -Dtest=!*IntegrationTest

  payment-service-ci:
    name: Payment Service CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Create test properties
        run: |
          mkdir -p payment-service/src/test/resources
          cat > payment-service/src/test/resources/application-test.properties << 'EOF'
          spring.data.mongodb.uri=mongodb://localhost:27017/test
          spring.data.mongodb.database=test
          spring.redis.host=localhost
          spring.redis.port=6379
          spring.kafka.bootstrap-servers=
          spring.kafka.enabled=false
          spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
          jwt.secret=test-secret-123
          EOF

      - name: Run only unit tests (skip integration)
        run: |
          cd payment-service
          mvn -B clean test -Dtest=!*IntegrationTest

  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [user-service-ci, order-service-ci, payment-service-ci]
    if: always()

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker images
        run: |
          docker build -t ghcr.io/${{ github.repository }}/user-service:latest ./user-service
          docker build -t ghcr.io/${{ github.repository }}/order-service:latest ./order-service
          docker build -t ghcr.io/${{ github.repository }}/payment-service:latest ./payment-service